<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cambiar contraseña | Biblioteca FIO</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <main class="login-contenedor">

        <div class="login-caja">

            <img src="../Logo_FIO.png"
                 alt="Fundación Infante de Orleans"
                 class="logo-admin">

            <h1>Biblioteca FIO</h1>
            <h2>Nueva contraseña</h2>

            <p>
                Introduce la nueva contraseña que deseas utilizar
                para acceder a la Biblioteca FIO.
            </p>

            <form id="form-cambiar-password">

                <label for="nueva-password">
                    Nueva contraseña
                </label>

                <input
                    type="password"
                    id="nueva-password"
                    autocomplete="new-password"
                    required
                    minlength="8"
                >

                <label for="repetir-password">
                    Repetir contraseña
                </label>

                <input
                    type="password"
                    id="repetir-password"
                    autocomplete="new-password"
                    required
                    minlength="8"
                >

                <button type="submit">
                    Cambiar contraseña
                </button>

            </form>

            <p id="mensaje-password"></p>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="cambiar-password.js"></script>

</body>

</html>
